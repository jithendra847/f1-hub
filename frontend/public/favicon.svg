<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="f1-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E1E"/>
      <stop offset="100%" stop-color="#D00400"/>
    </linearGradient>
    
    <linearGradient id="f1-red-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#FF1E1E"/>
    </linearGradient>
    
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F232D"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>

    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#99A3B4"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF1E1E" flood-opacity="0.5"/>
    </filter>

    <filter id="car-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Badge Outer Frame -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#dark-bg)" stroke="#FF1E1E" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Background Dynamic Speed Lines -->
  <g opacity="0.25">
    <path d="M 60 130 L 290 130 L 250 160 L 60 160 Z" fill="url(#f1-red)"/>
    <path d="M 80 180 L 380 180 L 340 205 L 80 205 Z" fill="url(#f1-red)"/>
    <path d="M 60 360 L 420 360 L 390 380 L 60 380 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Formula 1 Race Car Graphic (Sleek Side Profile) -->
  <g filter="url(#glow-red)" transform="translate(0, 10)">
    
    <!-- Underbody / Diffuser Air Flow line -->
    <path d="M 80 322 L 430 322" stroke="#FF1E1E" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Main Car Body Silhouette -->
    <path d="
      M 75 305 
      L 70 280 
      L 115 282 
      L 145 272 
      L 215 240 
      L 245 235 
      L 260 215 
      L 295 210 
      L 310 230 
      L 380 230 
      L 385 200 
      L 440 200 
      L 435 245 
      L 445 295 
      L 415 315 
      L 395 315 
      L 375 285 
      L 330 285 
      L 315 315 
      L 185 315 
      L 170 285 
      L 130 285 
      L 115 315 
      L 75 315 Z" 
      fill="url(#f1-red)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" filter="url(#car-shadow)" />

    <!-- Front Wing Assembly Details -->
    <path d="M 65 308 L 125 308 L 130 298 L 65 298 Z" fill="url(#silver-grad)" />
    <path d="M 70 280 L 80 280 L 80 312 L 70 312 Z" fill="#FFFFFF" />

    <!-- Rear Wing Assembly Details (Upper Wing & Endplate) -->
    <rect x="385" y="195" width="55" height="10" rx="2" fill="url(#silver-grad)" />
    <rect x="388" y="210" width="50" height="7" rx="1.5" fill="url(#f1-red-bright)" />
    <path d="M 430 190 L 442 190 L 442 260 L 430 260 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Cockpit & Halo Structure -->
    <path d="M 235 242 C 235 225, 275 225, 285 242 Z" fill="#0E1015" />
    <!-- Driver Helmet -->
    <circle cx="260" cy="235" r="10" fill="url(#gold-grad)" />
    <!-- Halo Curved Protection Bar -->
    <path d="M 230 242 Q 255 220 285 238" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Sidepod Air Intake Accent & Body Swoosh -->
    <path d="M 220 260 Q 270 250 340 258" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round" />
    <path d="M 230 272 Q 285 265 365 272" stroke="url(#f1-red-bright)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Front Racing Tyre -->
    <circle cx="150" cy="300" r="32" fill="#15171C" stroke="#333A48" stroke-width="6" />
    <circle cx="150" cy="300" r="18" fill="#222733" />
    <circle cx="150" cy="300" r="10" fill="url(#f1-red)" />
    <!-- Tyre Rim Accents -->
    <circle cx="150" cy="300" r="26" stroke="#FF1E1E" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.8" />

    <!-- Rear Racing Tyre -->
    <circle cx="352" cy="300" r="36" fill="#15171C" stroke="#333A48" stroke-width="6" />
    <circle cx="352" cy="300" r="20" fill="#222733" />
    <circle cx="352" cy="300" r="11" fill="url(#f1-red)" />
    <!-- Tyre Rim Accents -->
    <circle cx="352" cy="300" r="29" stroke="#FF1E1E" stroke-width="2" stroke-dasharray="7,7" fill="none" opacity="0.8" />

    <!-- Motion / Speed Sparks from Rear -->
    <path d="M 445 285 L 485 285" stroke="#FF4D4D" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 440 298 L 475 298" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 445 310 L 465 310" stroke="#FF1E1E" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>

